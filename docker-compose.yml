# EVIDRA: API + UI, non-root, named volume for data/index, readiness healthcheck.
# The api service loads the pipeline before it reports healthy (/api/ready).
services:
  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    volumes:
      - evidra_data:/app/data
      - evidra_index:/app/index
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build: .
    command: ["app"]
    ports:
      - "8501:8501"
    volumes:
      - evidra_data:/app/data
      - evidra_index:/app/index
    environment:
      - PYTHONPATH=/app
      - EVIDRA_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  evidra_data:
  evidra_index:
